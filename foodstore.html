// ============ 状态管理 ============
const state = {
  queue: [],
  round: 1,
  roundIdx: 0,
  currentFood: null,
  q1Answered: false,
  q2Answered: false
};

const ROUND_SIZE = 5;

// ============ 音频 ============
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { console.warn('音频不可用'); }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playSuccess() {
  initAudio();
  if (!audioCtx) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime + i * 0.09;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    osc.start(t);
    osc.stop(t + 0.45);
  });
}

function playFail() {
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(320, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.45);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.45);
}

function playVictory() {
  initAudio();
  if (!audioCtx) return;
  const notes = [
    { f: 523.25, t: 0,    d: 0.18 },
    { f: 659.25, t: 0.18, d: 0.18 },
    { f: 783.99, t: 0.36, d: 0.18 },
    { f: 1046.5, t: 0.54, d: 0.7  }
  ];
  notes.forEach(n => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = n.f;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime + n.t;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, t + n.d);
    osc.start(t);
    osc.stop(t + n.d + 0.05);
  });
  setTimeout(() => {
    if (!audioCtx) return;
    [1318.5, 1568, 2093].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const t = audioCtx.currentTime + i * 0.08;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.15, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      osc.start(t);
      osc.stop(t + 0.45);
    });
  }, 700);
}

// ============ 撒花效果 ============
const canvas = document.getElementById('confettiCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let animId = null;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function createConfetti(count = 150) {
  const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#f368e0', '#ff9f43', '#54a0ff', '#ffd93d'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 150,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * 3 + 1.5,
      size: Math.random() * 10 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 14,
      life: 1,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  if (!animId) animateConfetti();
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.y < canvas.height + 50 && p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.99;
    p.rotation += p.rotationSpeed; p.life -= 0.004;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life);
    if (p.shape === 'rect') {
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    } else {
      ctx.beginPath();
      ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
  if (particles.length > 0) {
    animId = requestAnimationFrame(animateConfetti);
  } else {
    animId = null;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function bigConfetti() {
  const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#f368e0', '#ff9f43', '#54a0ff', '#ffd93d', '#ff7675'];
  for (let i = 0; i < 220; i++) {
    particles.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * 300,
      y: canvas.height + 20,
      vx: (Math.random() - 0.5) * 16,
      vy: -Math.random() * 16 - 8,
      size: Math.random() * 12 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 18,
      life: 1,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  for (let i = 0; i < 180; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      vx: (Math.random() - 0.5) * 6,
      vy: Math.random() * 3 + 2,
      size: Math.random() * 10 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotationSpeed: (Math.random() - 0.5) * 14,
      life: 1,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  if (!animId) animateConfetti();
}

// ============ 工具函数 ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============ 进度条 ============
function updateProgressBar() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for (let i = 0; i < ROUND_SIZE; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < state.roundIdx) {
      dot.classList.add('done');
      dot.textContent = '✓';
    } else if (i === state.roundIdx) {
      dot.classList.add('current');
      dot.textContent = i + 1;
    } else {
      dot.textContent = i + 1;
    }
    bar.appendChild(dot);
  }
}

// ============ 加载食物 ============
function loadFood() {
  const foodIndex = (state.round - 1) * ROUND_SIZE + state.roundIdx;
  state.currentFood = state.queue[foodIndex];
  state.q1Answered = false;
  state.q2Answered = false;
  
  document.getElementById('foodEmoji').textContent = state.currentFood.emoji;
  document.getElementById('foodName').textContent = state.currentFood.name;
  
  updateProgressBar();
  
  document.getElementById('question1').classList.remove('hidden');
  document.getElementById('question2').classList.add('hidden');
  document.getElementById('explanation').classList.add('hidden');
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('nextBtn').textContent = '下一个食物 →';
  
  const opts1 = shuffle([state.currentFood.method, ...state.currentFood.methodWrong]);
  const container1 = document.getElementById('options1');
  container1.innerHTML = '';
  opts1.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = text;
    btn.onclick = () => handleAnswer(btn, text === state.currentFood.method, 1);
    container1.appendChild(btn);
  });
  
  const opts2 = shuffle([state.currentFood.principle, ...state.currentFood.principleWrong]);
  const container2 = document.getElementById('options2');
  container2.innerHTML = '';
  opts2.forEach(text => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = text;
    btn.onclick = () => handleAnswer(btn, text === state.currentFood.principle, 2);
    container2.appendChild(btn);
  });
  
  document.getElementById('explanationText').textContent = state.currentFood.explanation;
}

// ============ 处理答案 ============
function handleAnswer(btn, isCorrect, qNum) {
  if (isCorrect) {
    btn.classList.add('correct');
    Array.from(btn.parentElement.children).forEach(b => b.disabled = true);
    playSuccess();
    createConfetti(80);
    
    if (qNum === 1) {
      state.q1Answered = true;
      setTimeout(() => {
        document.getElementById('question2').classList.remove('hidden');
        document.getElementById('question2').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 800);
    } else {
      state.q2Answered = true;
      setTimeout(() => {
        document.getElementById('explanation').classList.remove('hidden');
        if (state.roundIdx === ROUND_SIZE - 1) {
          document.getElementById('nextBtn').textContent = '查看挑战结果 🏆';
        } else {
          document.getElementById('nextBtn').textContent = '下一个食物 →';
        }
        document.getElementById('nextBtn').classList.remove('hidden');
        document.getElementById('nextBtn').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 800);
    }
  } else {
    btn.classList.add('wrong');
    btn.disabled = true;
    playFail();
  }
}

// ============ 下一个食物 / 查看结果 ============
function goNext() {
  state.roundIdx++;
  
  if (state.roundIdx >= ROUND_SIZE) {
    showSuccessScreen();
  } else {
    loadFood();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ============ 显示成功画面 ============
function showSuccessScreen() {
  document.getElementById('gameArea').classList.add('hidden');
  document.getElementById('progressBar').classList.add('hidden');
  
  const successScreen = document.getElementById('successScreen');
  successScreen.classList.remove('hidden');
  successScreen.scrollIntoView({ behavior: 'smooth', block: 'center' });
  
  playVictory();
  setTimeout(() => bigConfetti(), 100);
  setTimeout(() => bigConfetti(), 800);
  setTimeout(() => bigConfetti(), 1600);
  
  const continueBtn = document.getElementById('continueBtn');
  continueBtn.classList.remove('hidden');
}

// ============ 继续挑战（重新洗牌） ============
function continueChallenge() {
  state.queue = shuffle(foods);
  state.round = 1;
  state.roundIdx = 0;
  
  document.getElementById('successScreen').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  document.getElementById('progressBar').classList.remove('hidden');
  
  particles = [];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  loadFood();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============ 初始化 ============
function init() {
  state.queue = shuffle(foods);
  state.round = 1;
  state.roundIdx = 0;
  loadFood();
}

init();
</script>
